<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Access - Tunas Gurindam Corps</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 50px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .header h1 {
      color: #4f46e5;
      font-size: 2.5rem;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .header p {
      color: #6b7280;
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    .login-btn {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      padding: 18px 40px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3);
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4);
    }

    .nav-links {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #e5e7eb;
    }

    .nav-links a {
      color: #6b7280;
      text-decoration: none;
      font-weight: 600;
      margin: 0 15px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #4f46e5;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      .header h1 {
        font-size: 2rem;
      }

      .nav-links a {
        display: block;
        margin: 10px 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔐 Admin Access</h1>
      <p>Tunas Gurindam Corps - Portal Administrator</p>
    </div>

    <div style="text-align: center; padding: 20px;">
      <div class="loading" style="display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="margin-top: 15px; color: #6b7280; font-size: 1.1rem;">Mengalihkan ke halaman login...</p>
    </div>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Auto redirect to admin login page
    window.location.href = 'admin-login.html';
  </script>
</body>
</html>
